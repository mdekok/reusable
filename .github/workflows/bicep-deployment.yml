name: Deploy Bicep file (deployment stack)

on:
  workflow_call:
    inputs:
      action:
        description: 'Deployment action: validate, whatIf or create'
        required: true
        type: string
      filepath:
        required: true
        type: string
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
        default: 'latest'
      tag:
        description: >-
          Tag included in the deployment stack name. Must be a valid Azure resource-name
          segment: alphanumerics, underscore, hyphen, period or parentheses only.
          Slashes and other characters are not allowed.
        required: false
        type: string
        default: 'main'
      actionOnUnmanageResources:
        description: 'What happens to resources removed from the template: detach or delete.'
        required: false
        type: string
        default: 'detach'
      denySettingsMode:
        description: 'Deny settings mode: none, denyDelete or denyWriteAndDelete.'
        required: false
        type: string
        default: 'none'
      denySettingsExcludedPrincipals:
        description: 'Comma-separated Entra object IDs excluded from deny settings (max 5).'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Login Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deployment Stack
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: ${{ inputs.action }}
          name: ${{ vars.LABEL }}-${{ inputs.tag }}-deployment-stack
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.RESOURCE_GROUP }}
          template-file: ${{ inputs.filepath }}
          parameters: |
            env: '${{ vars.LABEL }}'
            version: '${{ inputs.version }}'
            location: '${{ vars.LOCATION }}'
          action-on-unmanage-resources: ${{ inputs.actionOnUnmanageResources }}
          deny-settings-mode: ${{ inputs.denySettingsMode }}
          deny-settings-excluded-principals: ${{ inputs.denySettingsExcludedPrincipals }}
          description: 'GitHub ${{ github.repository }} ${{ github.sha }} (${{ inputs.filepath }})'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment stack"
            echo ""
            echo "- Stack: \`${{ vars.LABEL }}-${{ inputs.tag }}-deployment-stack\`"
            echo "- Scope: \`${{ vars.RESOURCE_GROUP }}\`"
            echo "- Operation: \`${{ inputs.action }}\`"
            echo "- Template: \`${{ inputs.filepath }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
